# Tool config only: the app installs from requirements*.txt (fleet standard, CI-UNIT-02).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["debate"]
branch = true

[tool.coverage.report]
fail_under = 65

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
