# Fleet standard ci.yml (library tier, public). Stages call VelimirMueller/fleet-workflows at v0.0.2.
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e stage
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.2
    with:
      stack: python
      # ruff runs through uvx; no app dependencies needed.
      install-command: "true"

  unit:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-unit.yml@v0.0.2
    with:
      stack: python
      # No [project] table: install from requirements-dev.txt only.
      install-command: uv venv && uv pip install -r requirements-dev.txt && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Keep equal to fail_under in pyproject.toml; raise both together (fleet.yml exception CI-UNIT-03).
      coverage-floor: 65

  e2e:
    needs: [changes, unit]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-e2e.yml@v0.0.2
    with:
      stack: python
      install-command: "true"

  build:
    needs: [changes, e2e]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-build.yml@v0.0.2
    with:
      stack: python
      install-command: "true"
      # Not a package: the build byte-compiles the app (no uv build without a [project] table).
      command: python3 -m compileall -q debate main.py
      pack: false

  conclusion:
    needs: [changes, lint, unit, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or a required stage was skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          if [ "$CODE" = "true" ]; then
            for r in "$LINT" "$UNIT" "$BUILD"; do
              [ "$r" = "success" ] || { echo "::error::a required stage did not run"; exit 1; }
            done
          fi
